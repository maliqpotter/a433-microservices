name: CI Karsajobs UI

on:
  push:
    branches: [ karsajobs-ui ]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build_and_push:
    runs-on: ubuntu-latest
    needs: lint
    env:
      IMAGE_NAME: ghcr.io/maliqpotter/karsajobs-ui:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.USERNAME_DOCKER_HUB }}
          password: ${{ secrets.PASSWORD_DOCKER_HUB }}

      - name: Build Docker image
        run: docker build -t karsajobs-ui:latest .

      - name: Tag Docker image
        run: docker tag karsajobs-ui:latest $IMAGE_NAME

      - name: Push Docker image
        run: docker push $IMAGE_NAME
