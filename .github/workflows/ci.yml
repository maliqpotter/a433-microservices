name: CI Karsajobs

on:
  push:
    branches: [ karsajobs ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  test_app:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # atau versi yang sesuai proyekmu

      - name: Run Unit Tests
        run: go test -v -short --count=1 $(go list ./...)

  build_app_karsajobs:
    runs-on: ubuntu-latest
    needs: test_app
    env:
      IMAGE_NAME: ghcr.io/maliqpotter/karsajobs:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.USERNAME_DOCKER_HUB }}
          password: ${{ secrets.PASSWORD_DOCKER_HUB }}

      - name: Build Docker Image
        run: docker build -t karsajobs:latest .

      - name: Tag Docker Image
        run: docker tag karsajobs:latest $IMAGE_NAME

      - name: Push Docker Image
        run: docker push $IMAGE_NAME
